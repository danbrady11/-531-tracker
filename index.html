<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>5/3/1 Tracker</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="5/3/1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>5/3/1</h1>
    <div class="cycle-badge" id="cycle-badge">Day – · Week –</div>
  </header>

  <main id="view-root" class="view-root"></main>

  <div id="rest-timer" class="rest-timer" hidden>
    <button class="rest-timer-toggle" id="rest-timer-toggle" type="button">
      <span id="rest-timer-time">0:00</span>
      <span id="rest-timer-label" class="rest-timer-label"></span>
    </button>
    <button class="rest-timer-cancel" id="rest-timer-cancel" type="button" aria-label="Cancel rest timer">✕</button>
  </div>

  <nav class="tab-nav">
    <button class="tab-btn" data-view="today" type="button">
      <span class="tab-icon" aria-hidden="true">●</span>Today
    </button>
    <button class="tab-btn" data-view="history" type="button">
      <span class="tab-icon" aria-hidden="true">▲</span>History
    </button>
    <button class="tab-btn" data-view="calendar" type="button">
      <span class="tab-icon" aria-hidden="true">▦</span>Calendar
    </button>
    <button class="tab-btn" data-view="settings" type="button">
      <span class="tab-icon" aria-hidden="true">■</span>Settings
    </button>
  </nav>

  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("service-worker.js")
          .then((reg) => {
            // A standalone/home-screen-installed PWA on iOS can sit resumed
            // from the background for a long time without ever making a
            // fresh navigation request, so it can miss an update check that
            // a plain Safari tab would pick up. Force one now and again
            // whenever the app comes back to the foreground.
            reg.update();
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") reg.update();
            });
          })
          .catch((err) => console.error("SW registration failed", err));
      });

      // Once a new service worker takes over, reload immediately so the new
      // version is actually running instead of waiting for the next full
      // close-and-reopen — this is the step that was previously manual.
      let reloadedForNewWorker = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadedForNewWorker) return;
        reloadedForNewWorker = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
